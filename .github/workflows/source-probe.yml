name: Official source form discovery (read-only)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/bddk_probe.py'
      - 'scripts/probe_credit_labels.py'
      - '.github/workflows/source-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.32.3 beautifulsoup4==4.13.4
      - run: python scripts/bddk_probe.py
      - run: python -m scripts.probe_credit_labels
      - uses: actions/upload-artifact@v4
        with:
          name: bddk-public-form-structure
          path: probe_report.json
          retention-days: 7
